[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "AA_Afectacion_incendio_en_turbera"
version = "0.0.1"
description = "Proyecto para parcial de AA"
authors = [
  { name = "Sandra_Vargas" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["AA_Afectacion_incendio_en_turbera"]
include = ["pyproject.toml", "AA_Afectacion_incendio_en_turbera/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["AA_Afectacion_incendio_en_turbera"]
force-sort-within-sections = true

